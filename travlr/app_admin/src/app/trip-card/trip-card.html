<div class="card h-100" *ngIf="trip" style="width: 18rem;">
  <div class="card-header">{{ trip.name }}</div>

  <img class="card-img-top"
       [src]="'assets/images/' + trip.image"
       alt="trip thumbnail" />

  <div class="card-body d-flex flex-column">
    <h6 class="card-subtitle mb-2 text-muted">{{ trip.resort }}</h6>

    <p class="card-subtitle mt-3 mb-3 text-muted">
      {{ trip.length }} only {{ trip.perPerson | currency:'USD':'symbol' }} per person
    </p>

    <div class="card-text" [innerHTML]="trip.description"></div>

    <div class="mt-auto">
      <button (click)="editTrip(trip)" class="btn btn-info w-100">
        Edit Trip
      </button>
    </div>
  </div>
</div>
