<p class="mt-2">{{ message }}</p>
<p>Trips loaded: {{ trips.length }}</p>

<div>
  <button (click)="addTrip()" class="btn btn-info">Add Trip</button>
</div>

<div class="container mt-4">
  <div class="row g-3">
    <div *ngFor="let trip of trips"
         class="col-12 col-md-6 col-lg-4 d-flex justify-content-center">
      <app-trip-card [trip]="trip"></app-trip-card>
    </div>
  </div>
</div>
